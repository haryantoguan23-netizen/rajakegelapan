<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemberitahuan Usia</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111827;color:#f8fafc;font-family:Arial,sans-serif}
main{width:min(100%,800px);padding:52px 34px;text-align:center;background:#1f2937;border:1px solid #37465d;border-radius:28px}
.mark{width:145px;height:145px;margin:0 auto 42px;border:4px solid #fbbf24;border-radius:50%;display:grid;place-items:center;color:#fbbf24;font-size:58px;font-weight:800}
h1{font-size:42px;margin:0 0 32px}
p{color:#d1d5db;font-size:26px;line-height:1.5;margin:0 0 40px}
button{display:block;width:100%;padding:34px 18px;background:#111c2e;border:0;border-radius:22px;color:#fff;font-size:34px;font-weight:800;cursor:pointer}
button:hover{background:#17263d}
button:focus-visible{outline:4px solid #fbbf24;outline-offset:4px}
#count{font-size:72px;font-weight:800;color:#fbbf24;margin:48px 0 40px}
.small{font-size:20px;color:#9ca3af;margin:0}
@media(max-width:600px){main{padding:34px 22px}.mark{width:105px;height:105px;font-size:42px;margin-bottom:30px}h1{font-size:30px}p{font-size:18px;margin-bottom:28px}button{font-size:23px;padding:25px 12px}#count{font-size:56px;margin:34px 0}.small{font-size:15px}}
</style>
</head>
<body>
<main>
  <div class="mark">18+</div>
  <h1>Pemberitahuan Usia</h1>
  <p>Halaman ini ditujukan untuk pengguna berusia 18 tahun ke atas.</p>
  <button id="confirm" type="button">SAYA BERUSIA 18+</button>
  <div id="count" role="status" aria-live="polite">3</div>
  <p class="small">Jika Anda tidak ingin melanjutkan, silakan tutup halaman ini.</p>
</main>
<script>
const destination = "https://eagel.joker11alternatif.com/";
let seconds = 3;
let redirected = false;
const count = document.getElementById("count");

function goToDestination() {
  if (redirected) return;
  redirected = true;
  window.location.href = destination;
}

document.getElementById("confirm").addEventListener("click", goToDestination);

const timer = setInterval(() => {
  seconds -= 1;
  count.textContent = seconds > 0 ? seconds : "Membuka tujuan…";
  if (seconds <= 0) {
    clearInterval(timer);
    goToDestination();
  }
}, 1000);
</script>
</body>
</html>
